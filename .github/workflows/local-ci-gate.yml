name: platform-adaptation

on:
  pull_request:
  push:
    branches:
      - release
      - nightly
      - stable
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-ci-gate:
    name: platform-adaptation / linux-ci-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      STYIO_LLVM_MAJOR: "18"
      STYIO_CMAKE_VERSION: "3.31.6"
      STYIO_PYTHON_VERSION: "3.13.5"

    steps:
      - name: Checkout styio-cloud
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: styio-cloud

      - name: Set up standardized Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.STYIO_PYTHON_VERSION }}

      - name: Install standardized CMake / CTest
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user "cmake==${STYIO_CMAKE_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            clang-${STYIO_LLVM_MAJOR} \
            lld-${STYIO_LLVM_MAJOR}

      - name: Verify standardized toolchain
        run: |
          python3 --version
          cmake --version | head -n1
          ctest --version | head -n1
          clang-${STYIO_LLVM_MAJOR} --version | head -n1

      - name: Resolve CI refs
        id: ci_refs
        shell: bash
        working-directory: styio-cloud
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
            BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              BASE_REF="HEAD^"
              RANGE="HEAD^..HEAD"
            else
              BASE_REF="HEAD"
              RANGE="HEAD"
            fi
          elif [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              BASE_REF="HEAD^"
            else
              BASE_REF="HEAD"
            fi
            RANGE="HEAD"
          else
            BASE_REF="${{ github.event.before }}"
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi

          echo "base_ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "range=${RANGE}" >> "$GITHUB_OUTPUT"

      - name: Run styio-cloud local CI gate
        working-directory: styio-cloud
        run: >
          ./scripts/delivery-gate.sh
          --mode push
          --base "${{ steps.ci_refs.outputs.base_ref }}"
          --range "${{ steps.ci_refs.outputs.range }}"
          --skip-audit
          --build-dir "$RUNNER_TEMP/styio-cloud-build"

  test-smoke:
    name: test / smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STYIO_PYTHON_VERSION: "3.13.5"

    steps:
      - name: Checkout styio-cloud
        uses: actions/checkout@v5

      - name: Set up standardized Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.STYIO_PYTHON_VERSION }}

      - name: Run smoke tests
        run: python3 -m unittest discover -s tests/unit -v

  test-golden-standard:
    name: test / golden-standard
    needs: [local-ci-gate, test-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      STYIO_LLVM_MAJOR: "18"
      STYIO_CMAKE_VERSION: "3.31.6"
      STYIO_PYTHON_VERSION: "3.13.5"

    steps:
      - name: Checkout styio-cloud
        uses: actions/checkout@v5

      - name: Set up standardized Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.STYIO_PYTHON_VERSION }}

      - name: Install golden-standard dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user "cmake==${STYIO_CMAKE_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            clang-${STYIO_LLVM_MAJOR} \
            lld-${STYIO_LLVM_MAJOR}

      - name: Run platform golden delivery floor
        run: ./scripts/delivery-gate.sh --skip-audit --build-dir "$RUNNER_TEMP/styio-cloud-golden"
